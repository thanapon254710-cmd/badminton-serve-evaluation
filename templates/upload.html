<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Serve Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #1f6b3a;
    --court-light: #2e8b4f;
    --court-dim: #e5efe7;
    --line: #e8b13a;
    --ink: #1c2521;
    --muted: #5c6b62;
    --paper: #f7f8f4;
    --card: #ffffff;
    --border: #dfe4de;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; margin: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0;
  }

  .page-shell {
    width: 100%;
    min-height: 100vh;
    padding: 28px 42px 42px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--court);
    text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px 0;
  }

/* ---- top navigation / workflow ---- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--court);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .steps {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .step-number {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  .step.done .step-number,
  .step.active .step-number {
    background: var(--court);
    color: #fff;
    border-color: var(--court);
  }

  .step.active {
    color: var(--ink);
    font-weight: 900;
  }

  .step-line {
    width: 22px;
    height: 1px;
    background: var(--border);
  }

  /* ---- page grid ----
     Left column : service-side tabs + court diagram / landing target card
     Right column: two dropzones side by side -> "Uploaded clips" panel -> Upload button
     (the card spans the dropzone, preview and button rows; the last row is 1fr so the
     button sits directly under the preview panel and the card sets the overall height). */
  .page-layout {
    /* Layout width grows with the window (i.e. when the browser is zoomed out) so the page keeps the
       same proportions: 1480px at a 1827px-wide window (what looks right at 67% zoom), 81% of the
       window beyond that. Left card, gaps and diagram are all derived from it. */
    --layout-w: clamp(1480px, 81vw, 2800px);
    --side-w: calc(var(--layout-w) * 0.2676);                /* 396px at 1480px */
    width: 100%;
    max-width: var(--layout-w);
    margin: 0 auto;
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
    grid-template-rows: auto auto auto 1fr;
    column-gap: calc(var(--layout-w) * 0.0351);               /* 52px at 1480px */
    align-items: start;
  }

  .page-head { grid-column: 1 / -1; grid-row: 1; padding-top: 16px; }

  .dropzone-row {
    grid-column: 2; grid-row: 2;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, var(--side-w)));  /* each dropzone as wide as the left card */
    gap: 40px;
    margin-bottom: 16px;
  }

  .target-card {
    grid-column: 1; grid-row: 2 / 5;
    align-self: start;
    min-width: 0;
  }

  .submit-area {
    grid-column: 2; grid-row: 4;
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 10px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 30px; margin: 0 0 6px 0;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 14.5px; margin: 0 0 24px 0; }

  .dropzone {
    position: relative;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    background: var(--card);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .dropzone:hover { border-color: var(--court-light); }
  .dropzone.dragover { border-color: var(--court); background: var(--court-dim); }
  .dropzone.filled { border-style: solid; border-color: var(--court-light); }
  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .dz-icon {
    flex: none; width: 42px; height: 42px; border-radius: 9px;
    background: var(--court-dim); color: var(--court);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
  }
  .dz-text { flex: 1; min-width: 0; }
  .dz-label { font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
  .dz-sub { font-size: 12.5px; color: var(--muted); }
  .dz-filename {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--court);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px;
  }

  /* ---- service side + landing target card ---- */
  .target-card {
    border: 1px solid #6f7872;
    border-radius: 14px;
    background: var(--card);
    overflow: hidden;
    margin: 0;
  }
  .side-tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid #6f7872;
  }
  .side-tab {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14.5px;
    color: var(--ink); background: var(--card);
    border: 0; padding: 10px 12px; cursor: pointer;
    transition: background .12s;
  }
  .side-tab + .side-tab { border-left: 1px solid #6f7872; }
  .side-tab:hover { background: #f1f5f1; }
  .side-tab.selected { background: var(--court-dim); }
  .side-tab:focus-visible { outline: 2px solid var(--court-light); outline-offset: -3px; }
  .target-body { padding: 15px 20px 14px; min-width: 0; }

  .target-help { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0 0 10px 0; }
  .target-opt { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; cursor: pointer; margin: 0 0 8px 0; }
  .target-opt input { margin-top: 3px; }
  .target-opt small { display: block; font-size: 11.5px; line-height: 1.4; color: var(--muted); margin-top: 1px; }

  /* The diagram shrinks with the window height so the whole card fits on screen without
     scrolling: 480px = everything above/below it (topbar, title, tabs, radios, readout, padding);
     0.546 = the diagram's width/height ratio (226/414). Never larger than 79% of the card, never smaller than 150px. */
  #courtMap {
    display: block;
    width: min(100%, calc(var(--side-w) * 0.788), max(150px, calc((100vh - 480px) * 0.546)));   /* 312px at 1480px */
    margin: 0 auto 18px;
  }
  #courtMap .ct-label {
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 7.5px;
    fill: #16167a; text-anchor: middle; pointer-events: none;
  }
  #courtMap .ct-num {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 7.5px;
    fill: var(--ink); text-anchor: middle; pointer-events: none;
  }
  #courtMap .tg-hit { fill: transparent; cursor: pointer; }
  #courtMap .tg-hit:focus { outline: none; }
  #courtMap .tg-dot { fill: #1c2521; pointer-events: none; }
  #courtMap .tg-ring { fill: none; stroke: transparent; stroke-width: 2; pointer-events: none; }
  #courtMap .tg-cell:hover .tg-ring,
  #courtMap .tg-cell:focus-within .tg-ring { stroke: #fff; }
  #courtMap .tg-cell.selected .tg-dot { fill: var(--line); }
  #courtMap .tg-cell.selected .tg-ring { stroke: var(--line); stroke-width: 2.5; }

  .target-readout { font-size: 12.5px; font-weight: 700; margin-top: 10px; }
  .target-readout:empty, .target-status:empty { display: none; }
  .target-legend { font-size: 11px; line-height: 1.5; color: var(--muted); margin-top: 4px; }
  .target-status { font-size: 11.5px; margin-top: 8px; color: var(--muted); }
  .target-status.ok { color: var(--court); }
  .target-status.err { color: var(--danger); }
  button.submit {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px;
    background: var(--court); color: #fff; border: none; border-radius: 8px;
    padding: 12px 22px; cursor: pointer; transition: background .12s;
    align-self: flex-end;
  }
  button.submit:hover { background: var(--court-light); }
  button.submit:disabled { opacity: .5; cursor: not-allowed; }

  .progress-wrap { display: none; }
  .progress-track {
    height: 8px; border-radius: 999px; background: var(--court-dim);
    overflow: hidden; margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--court), var(--court-light));
    border-radius: 999px; transition: width .15s ease;
  }
  .progress-label {
    display: block;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
  }

  .preview-note {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--paper);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }

  #formError {
    display: none; font-size: 13px; color: var(--danger);
    background: #fbeceb; border: 1px solid #f3c9c6; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 16px;
  }

  /* Preview area — page style only; upload/evaluation behavior is unchanged. */
  .preview-panel {
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    grid-column: 2; grid-row: 3;
    align-self: start;                           /* keep natural height even if the left card is taller */
  }
  .preview-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }
  .preview-heading .eyebrow { margin-bottom: 5px; }
  h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin: 0;
    letter-spacing: -0.01em;
  }
  .preview-count {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 9px; background: var(--paper);
  }
  .preview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  .preview-card {
    min-width: 0; border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; background: var(--paper);
  }
  .preview-card-header {
    min-height: 72px; padding: 14px 15px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .preview-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .preview-file {
    color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview-badge {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    background: var(--court-dim); color: var(--court); display: flex;
    align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700;
  }
  .video-wrap {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #111; overflow: hidden;
  }
  .video-wrap video {
    display: none; width: 100%; height: 100%; object-fit: contain; background: #111;
  }
  .empty-preview {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); font-size: 12px; background: var(--paper);
  }
  .empty-icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--court-dim);
    color: var(--court); display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
  }
  .video-wrap:not(.empty) .empty-preview { display: none; }

  @media (min-width: 1300px) {
    .page-shell { padding-left: 56px; padding-right: 56px; }
    .preview-panel { padding: 24px; }
  }

  /* narrower screens: single column — title, dropzones, previews, then side/target card + button */
  @media (max-width: 1100px) {
    .page-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .page-head, .dropzone-row, .preview-panel, .target-card, .submit-area { grid-column: 1; grid-row: auto; }
    .page-head { padding-top: 0; margin-bottom: 0; }
    .dropzone-row { order: 1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .preview-panel { order: 2; align-self: stretch; margin-bottom: 28px; }
    .target-card { order: 3; margin-bottom: 28px; }
    #courtMap { width: min(100%, 312px); }
    .submit-area { order: 4; margin-top: 0; }
  }

  @media (max-width: 900px) {
    .page-shell { padding: 25px 20px 45px; }
    .preview-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .dropzone-row { grid-template-columns: 1fr; gap: 16px; }
  }

  @media (max-width: 500px) {
    .page-shell { padding: 20px 14px 35px; }
    .topbar { margin-bottom: 24px; }
    .preview-panel { padding: 17px; }
    button.submit { width: 100%; }
  }
</style>
</head>
<body>
<div class="page-shell">

<div class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">SE</span>
    Upload
  </a>
  
  <div class="steps" aria-label="Evaluation progress">
    <span class="step active">
      <span class="step-number">1</span> Upload
    </span>
    <span class="step-line"></span>
    <span class="step">
      <span class="step-number">2</span> Calibrate
    </span>
    <span class="step-line"></span>
    <span class="step">
      <span class="step-number">3</span> Results
    </span>
  </div>
</div>

<form class="page-layout" id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">

  <header class="page-head">
    <h1>Serve Evaluator</h1>
    <p class="subtitle">Upload serve clips for evaluation</p>
    <div id="formError"></div>
  </header>

  <!-- left column: service side tabs + court diagram / landing target -->
  <aside class="target-card" id="targetSetup">
    <div class="side-tabs" role="tablist" aria-label="Service side">
      <button type="button" class="side-tab" id="tabLeft" role="tab" data-side="left" aria-selected="false">Left Side</button>
      <button type="button" class="side-tab selected" id="tabRight" role="tab" data-side="right" aria-selected="true">Right Side</button>
    </div>

    <div class="target-body">
      <svg id="courtMap" viewBox="0 0 226 414" role="group" aria-label="Court diagram with landing target"></svg>

      <label class="target-opt">
        <input type="radio" name="target_mode" value="corners" checked>
        <span><strong>All four corners (GCP3&ndash;GCP6)</strong>
          <small>Default. The nearest corner of the service box is the target.</small></span>
      </label>
      <label class="target-opt">
        <input type="radio" name="target_mode" value="point">
        <span><strong>One grid point</strong>
          <small>Pick the one intersection of the grid you want the serve to land on.</small></span>
      </label>

      <div class="target-readout" id="targetReadout"></div>
      <div class="target-status" id="targetStatus" role="status"></div>
    </div>
  </aside>

  <!-- two dropzones side by side -->
  <div class="dropzone-row">
    <label class="dropzone" id="dzSide" for="sideInput">
      <input type="file" id="sideInput" name="side_video" accept="video/*" required>
      <div class="dz-icon">S</div>
      <div class="dz-text">
        <div class="dz-label">Side camera video</div>
        <div class="dz-sub" id="sideSub">drop file or click to browse</div>
        <div class="dz-filename" id="sideFilename"></div>
      </div>
    </label>

    <label class="dropzone" id="dzBack" for="backInput">
      <input type="file" id="backInput" name="back_video" accept="video/*" required>
      <div class="dz-icon">B</div>
      <div class="dz-text">
        <div class="dz-label">Back camera video</div>
        <div class="dz-sub" id="backSub">drop file or click to browse</div>
        <div class="dz-filename" id="backFilename"></div>
      </div>
    </label>
  </div>

  <!-- uploaded clips preview -->
  <section class="preview-panel">
    <div class="preview-heading">
      <div>
        <h2>Uploaded clips</h2>
      </div>
      <span class="preview-count" id="previewCount">0 / 2</span>
    </div>

    <div class="preview-grid">
      <div class="preview-card">
        <div class="preview-card-header">
          <div style="min-width:0;">
            <div class="preview-title">Side camera</div>
            <div class="preview-file" id="sidePreviewName">No file selected</div>
          </div>
          <span class="preview-badge">S</span>
        </div>
        <div class="video-wrap empty" id="sideVideoWrap">
          <div class="empty-preview">
            <span class="empty-icon">S</span>
            <span>Side camera preview</span>
          </div>
          <video id="sidePreview" controls playsinline preload="metadata"></video>
        </div>
      </div>

      <div class="preview-card">
        <div class="preview-card-header">
          <div style="min-width:0;">
            <div class="preview-title">Back camera</div>
            <div class="preview-file" id="backPreviewName">No file selected</div>
          </div>
          <span class="preview-badge">B</span>
        </div>
        <div class="video-wrap empty" id="backVideoWrap">
          <div class="empty-preview">
            <span class="empty-icon">B</span>
            <span>Back camera preview</span>
          </div>
          <video id="backPreview" controls playsinline preload="metadata"></video>
        </div>
      </div>
    </div>
  </section>

  <!-- upload button (under the preview panel) -->
  <div class="submit-area">
    <div id="syncStatus" style="display:none; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--card);">
      <div id="syncStatusTitle" style="font-size:13px; font-weight:600; margin-bottom:8px;">Preparing…</div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-label" id="progressLabel"></span>
      </div>

    </div>

    <button class="submit" type="submit" id="submitBtn">Upload & Extract Frames</button>
  </div>

</form>

<script>
// ---- service side + landing target chooser ----
// The chosen side is carried to the calibration page (?side=left|right).
// The landing target is saved to the server as soon as it changes.
const serviceChoice = { side: "right" };

(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("courtMap");
  const readout = document.getElementById("targetReadout");
  const status = document.getElementById("targetStatus");
  const radios = document.querySelectorAll('input[name="target_mode"]');
  const sideTabs = document.querySelectorAll(".side-tab");
  let grid = { cols: 7, rows: 9, x_min_m: 1.98, x_max_m: 6.70, width_m: 2.59 };
  let target = { mode: "corners" };

  try {
    const saved = sessionStorage.getItem("serveSide");
    if (saved === "left" || saved === "right") serviceChoice.side = saved;
  } catch (e) { /* storage unavailable: keep the default */ }

  // Court drawing, in SVG units (viewBox 0 0 226 414)
  const COURT = {
    outerL: 19, singlesL: 38, centre: 116, singlesR: 194, outerR: 212,
    backFar: 9, longFar: 29, shortFar: 163, net: 201, shortNear: 241, longNear: 375, backNear: 395
  };
  const WHITE = "#fff", PURPLE = "#7b2d9e";

  function say(text, cls) { status.textContent = text; status.className = "target-status " + (cls || ""); }

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    if (parent) parent.appendChild(e);
    return e;
  }
  function line(x1, y1, x2, y2, extra) {
    return el("line", Object.assign({ x1, y1, x2, y2, stroke: WHITE, "stroke-width": 3 }, extra || {}), svg);
  }
  function text(cls, x, y, str) { el("text", { class: cls, x, y }, svg).textContent = str; }
  function dot(x, y, r, fill) { return el("circle", { cx: x, cy: y, r, fill: fill || PURPLE }, svg); }

  // Grid column 0 is the CENTRE LINE on both sides (same as the server), so on the
  // left side the columns run from the centre line (right edge of the box) out to
  // the left sideline, and on the right side from the centre line out to the right
  // sideline. The printed column numbers are 1-based, the same numbers the
  // calibration page reports.
  const boxX = () => serviceChoice.side === "left" ? [COURT.singlesL, COURT.centre] : [COURT.centre, COURT.singlesR];
  const colX = c => {
    const step = (COURT.singlesR - COURT.centre) / (grid.cols - 1);
    return serviceChoice.side === "left" ? COURT.centre - c * step : COURT.centre + c * step;
  };
  const rowY = r => COURT.shortNear + r * (COURT.backNear - COURT.shortNear) / (grid.rows - 1);

  function pointText(col, row) {
    const x = grid.x_min_m + row * (grid.x_max_m - grid.x_min_m) / (grid.rows - 1);
    const y = col * grid.width_m / (grid.cols - 1);
    return `Row ${row + 1} of ${grid.rows} (${x.toFixed(2)} m from the net), ` +
           `column ${col + 1} of ${grid.cols} (${y.toFixed(2)} m from the centre line)`;
  }

  function drawCourt() {
    const C = COURT;
    el("rect", { x: 0, y: 0, width: 226, height: 414, fill: "#00b050" }, svg);
    el("rect", { x: C.outerL, y: C.backFar, width: C.outerR - C.outerL, height: C.backNear - C.backFar,
                 fill: "none", stroke: WHITE, "stroke-width": 3 }, svg);
    [C.singlesL, C.singlesR].forEach(x => line(x, C.backFar, x, C.backNear));
    [C.longFar, C.shortFar, C.shortNear, C.longNear].forEach(y => line(C.outerL, y, C.outerR, y));
    line(C.centre, C.backFar, C.centre, C.shortFar);
    line(C.centre, C.shortNear, C.centre, C.backNear);
    line(C.outerL, C.net, C.outerR, C.net, { "stroke-dasharray": "10 6" });      // net
  }

  function drawNetPoints() {
    [[COURT.singlesL, "GCP1"], [COURT.centre, "GCP0 : 0,0,0"], [COURT.singlesR, "GCP2"]].forEach(([x, name]) => {
      dot(x, COURT.net, 4);
      text("ct-label", x, COURT.net - 9, name);
    });
  }

  function drawCorners() {
    const [xa, xb] = boxX();
    const w = xb - xa, h = COURT.backNear - COURT.shortNear;
    el("rect", { x: xa, y: COURT.shortNear, width: w, height: h, fill: "none", stroke: PURPLE, "stroke-width": 4 }, svg);
    el("rect", { x: xa, y: COURT.shortNear, width: w, height: h, fill: "none", stroke: WHITE, "stroke-width": 1.4 }, svg);
    [[xa, COURT.shortNear, "GCP3", -8], [xb, COURT.shortNear, "GCP4", -8],
     [xa, COURT.backNear, "GCP5", 13], [xb, COURT.backNear, "GCP6", 13]].forEach(([x, y, name, dy]) => {
      dot(x, y, 4);
      text("ct-label", x, y + dy, name);
    });
  }

  function drawGrid() {
    const [xa, xb] = boxX();
    const lineAttrs = { stroke: "#f3e9f8", "stroke-opacity": 0.85, "stroke-width": 1 };
    for (let c = 0; c < grid.cols; c++) {
      const x = colX(c);
      el("line", Object.assign({ x1: x, y1: COURT.shortNear, x2: x, y2: COURT.backNear }, lineAttrs), svg);
      text("ct-num", x, COURT.shortNear - 8, c + 1);
    }
    const rowLabelX = serviceChoice.side === "left" ? (COURT.outerL + COURT.singlesL) / 2 - 1
                                                    : (COURT.singlesR + COURT.outerR) / 2 + 1;
    for (let r = 0; r < grid.rows; r++) {
      const y = rowY(r);
      el("line", Object.assign({ x1: xa, y1: y, x2: xb, y2: y }, lineAttrs), svg);
      text("ct-num", rowLabelX, y + 2.6, r + 1);
    }
    for (let r = 0; r < grid.rows; r++) {
      for (let c = 0; c < grid.cols; c++) {
        const cx = colX(c), cy = rowY(r);
        const corner = (c === 0 || c === grid.cols - 1) && (r === 0 || r === grid.rows - 1);
        const g = el("g", { class: "tg-cell", "data-col": c, "data-row": r }, svg);
        const on = target.mode === "point" && target.col === c && target.row === r;
        if (on) g.classList.add("selected");
        el("circle", { class: "tg-ring", cx, cy, r: corner ? 9 : 5.5 }, g);
        el("circle", { class: "tg-dot", cx, cy, r: corner ? 6 : 1.9 }, g);
        const hit = el("circle", { class: "tg-hit", cx, cy, r: corner ? 6.5 : 6, tabindex: 0, role: "button",
                                   "aria-label": pointText(c, r), "aria-pressed": on ? "true" : "false" }, g);
        const choose = () => choosePoint(c, r);
        hit.addEventListener("click", choose);
        hit.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); } });
      }
    }
  }

  function render() {
    radios.forEach(r => { r.checked = r.value === target.mode; });
    sideTabs.forEach(b => {
      const on = b.dataset.side === serviceChoice.side;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });

    svg.innerHTML = "";
    drawCourt();
    drawNetPoints();
    if (target.mode === "point") {
      drawGrid();
      readout.textContent = (target.col === undefined)
        ? "Click an intersection to choose the target."
        : "Target: " + pointText(target.col, target.row);
    } else {
      drawCorners();
      readout.textContent = "";
    }
  }

  async function save(next) {
    say("");
    try {
      const resp = await fetch("/api/landing_target", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next)
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "Could not save the target.");
      target = data.target; grid = data.grid;
    } catch (err) {
      say(err.message || "Could not reach the server.", "err");
    }
    render();
  }

  function choosePoint(col, row) { save({ mode: "point", col, row }); }

  sideTabs.forEach(b => b.addEventListener("click", () => {
    serviceChoice.side = b.dataset.side;
    try { sessionStorage.setItem("serveSide", serviceChoice.side); } catch (e) { /* ignore */ }
    render();
  }));

  radios.forEach(r => r.addEventListener("change", () => {
    if (r.value === "corners") { save({ mode: "corners" }); }
    else if (target.mode === "point" && target.col !== undefined) { render(); }
    else {                                   // switched to "point" but nothing chosen yet: show the grid, save on click
      target = { mode: "point" }; render(); say("");
    }
  }));

  render();                                  // draw immediately; the saved target replaces it when it arrives
  fetch("/api/landing_target").then(r => r.json()).then(data => {
    target = data.target; grid = data.grid; render();
  }).catch(() => { render(); say("Could not load the saved target; defaults shown.", "err"); });
})();

function bytesToSize(bytes) {
  if (!bytes) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0, val = bytes;
  while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
  return `${val.toFixed(1)} ${units[i]}`;
}

function setVideoPreview(inputId, videoId, wrapId, nameId, camera) {
    const input = document.getElementById(inputId);
    const video = document.getElementById(videoId);
    const wrap = document.getElementById(wrapId);
    const name = document.getElementById(nameId);

    const file = input.files && input.files[0];

    if (input._previewUrl) {
        URL.revokeObjectURL(input._previewUrl);
        input._previewUrl = null;
    }

    if (!file) {
        video.removeAttribute("src");
        video.load();
        video.style.display = "none";
        wrap.classList.add("empty");
        name.textContent = "No video selected";
        return;
    }

    name.textContent = file.name;
    wrap.classList.remove("empty");

    // Videos are expected to already be browser-compatible MP4 (H.264/AAC)
    // before upload, so the local blob preview is the final preview — no
    // server-side conversion round trip needed here.
    input._previewUrl = URL.createObjectURL(file);
    video.src = input._previewUrl;
    video.muted = true;
    video.playsInline = true;
    video.style.display = "block";
    video.load();
}

function updatePreviewCount() {
  const sideSelected = document.getElementById("sideInput").files.length > 0;
  const backSelected = document.getElementById("backInput").files.length > 0;
  document.getElementById("previewCount").textContent =
    `${Number(sideSelected) + Number(backSelected)} / 2`;
}

function wireDropzone(zoneId, inputId, filenameId, subId, defaultSub) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  const filenameEl = document.getElementById(filenameId);
  const subEl = document.getElementById(subId);

  function showFile(file) {
    if (!file) {
      zone.classList.remove("filled");
      filenameEl.textContent = "";
      subEl.textContent = defaultSub;
      setVideoPreview(inputId, inputId === "sideInput" ? "sidePreview" : "backPreview",
        inputId === "sideInput" ? "sideVideoWrap" : "backVideoWrap",
        inputId === "sideInput" ? "sidePreviewName" : "backPreviewName",
        inputId === "sideInput" ? "side" : "back");
      updatePreviewCount();
      return;
    }
    zone.classList.add("filled");
    filenameEl.textContent = `${file.name} · ${bytesToSize(file.size)}`;
    subEl.textContent = "Selected — click to change";
    setVideoPreview(inputId, inputId === "sideInput" ? "sidePreview" : "backPreview",
      inputId === "sideInput" ? "sideVideoWrap" : "backVideoWrap",
      inputId === "sideInput" ? "sidePreviewName" : "backPreviewName",
      inputId === "sideInput" ? "side" : "back");
    updatePreviewCount();
  }

  input.addEventListener("change", () => showFile(input.files[0]));

  ["dragenter", "dragover"].forEach(evt =>
    zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add("dragover"); })
  );
  ["dragleave", "drop"].forEach(evt =>
    zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove("dragover"); })
  );
  zone.addEventListener("drop", (e) => {
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      showFile(input.files[0]);
    }
  });
}

wireDropzone("dzSide", "sideInput", "sideFilename", "sideSub", "iPhone 15 Pro Max · 24mm · drop file or click to browse");
wireDropzone("dzBack", "backInput", "backFilename", "backSub", "iPhone 15 Pro Ultra Wide · 13mm · drop file or click to browse");

document.getElementById("sidePreview").addEventListener("error", () => {
  document.getElementById("sidePreview").style.display = "none";
  document.getElementById("sideVideoWrap").classList.add("empty");
});

document.getElementById("backPreview").addEventListener("error", () => {
  document.getElementById("backPreview").style.display = "none";
  document.getElementById("backVideoWrap").classList.add("empty");
});

const form = document.getElementById("uploadForm");
const submitBtn = document.getElementById("submitBtn");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const formError = document.getElementById("formError");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  formError.style.display = "none";

  const sideFile = document.getElementById("sideInput").files[0];
  const backFile = document.getElementById("backInput").files[0];

  if (!sideFile || !backFile) {
    formError.textContent = "Please select both a side camera and a back camera video.";
    formError.style.display = "block";
    return;
  }

  const data = new FormData(form);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", form.action, true);

  submitBtn.disabled = true;
  submitBtn.textContent = "Uploading…";
  progressWrap.style.display = "block";
  document.getElementById("syncStatus").style.display = "block";
  document.getElementById("syncStatusTitle").textContent = "Uploading videos…";
  // the progress bar and status box appear below the clips; scroll just enough to show them
  submitBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });

  xhr.upload.addEventListener("progress", (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent =
        `${pct}% · ${bytesToSize(e.loaded)} / ${bytesToSize(e.total)}`;
    }
  });

  xhr.onload = () => {
    if (xhr.status < 200 || xhr.status >= 400) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload & Extract Frames";
      formError.textContent = "Upload failed (status " + xhr.status + "). Please try again.";
      formError.style.display = "block";
      return;
    }

    let response;
    try {
      response = JSON.parse(xhr.responseText);
    } catch (err) {
      formError.textContent = "Server returned an unexpected response.";
      formError.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload & Extract Frames";
      return;
    }

    if (!response.status_url) {
      formError.textContent = response.error || "Could not start processing.";
      formError.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload & Extract Frames";
      return;
    }

    progressFill.style.width = "100%";
    progressLabel.textContent = "Upload complete";

    pollUploadJob(response.status_url);
  };

  xhr.onerror = () => {
    submitBtn.disabled = false;
    submitBtn.textContent = "Upload & Extract Frames";
    formError.textContent = "Upload failed — check your connection and try again.";
    formError.style.display = "block";
  };

  xhr.send(data);
});

function pollUploadJob(statusUrl) {
  fetch(statusUrl, { cache: "no-store" })
    .then(r => r.json())
    .then(job => {
      const title = document.getElementById("syncStatusTitle");

      if (job.status === "extracting") {
        title.textContent = "Extracting frames…";
        const pct = job.total
          ? Math.round((job.current / job.total) * 100)
          : 0;
        progressFill.style.width = pct + "%";
        progressLabel.textContent =
          `${job.current} / ${job.total} frames`;
      } else if (job.status === "matching") {
        title.textContent = "Synchronizing cameras…";
        progressFill.style.width = "100%";
        progressLabel.textContent = "Matching frame timing";
      } else if (job.status === "done") {
        title.textContent = "✓ Videos ready";
        progressFill.style.width = "100%";
        progressLabel.textContent =
          `${job.pair_count || 0} synchronized frame pairs`;

        // Point both preview players at the server-hosted copies used for
        // synchronization, so what you see matches what was processed.
        if (job.side_preview_url) {
          const sideVideo = document.getElementById("sidePreview");
          sideVideo.src = job.side_preview_url;
          sideVideo.load();
          sideVideo.style.display = "block";
          document.getElementById("sideVideoWrap").classList.remove("empty");
        }

        if (job.back_preview_url) {
          const backVideo = document.getElementById("backPreview");
          backVideo.src = job.back_preview_url;
          backVideo.load();
          backVideo.style.display = "block";
          document.getElementById("backVideoWrap").classList.remove("empty");
        }

        document.getElementById("previewNote").style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload & Extract Frames";

        // Synchronization is already completed automatically in the backend.
        // The normal user workflow is:
        // Upload → Calibrate → Results.
        //
        // Sync Verification is intentionally NOT opened here. It remains
        // available from the "Check Synchronization" debug button on the
        // calibration page.
        setTimeout(() => {
          window.location.href = "/calibrate?side=" + encodeURIComponent(serviceChoice.side);
        }, 900);

        return;
      } else if (job.status === "error") {
        title.textContent = "Synchronization failed";
        formError.textContent = job.error || "Automatic synchronization failed.";
        formError.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload & Extract Frames";
        return;
      } else {
        title.textContent = "Preparing…";
      }

      setTimeout(() => pollUploadJob(statusUrl), 500);
    })
    .catch(() => {
      setTimeout(() => pollUploadJob(statusUrl), 1000);
    });
}
