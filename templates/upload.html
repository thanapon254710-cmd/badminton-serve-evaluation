<!DOCTYPE html>
<html>
<head><title>Upload Serve Clips</title></head>
<body style="font-family: sans-serif; max-width: 500px; margin: 40px auto;">
  <h2>Badminton Serve Evaluator</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label>Side camera video:</label><br>
    <input type="file" name="side_video" accept="video/*" required><br><br>
    <label>Back camera video:</label><br>
    <input type="file" name="back_video" accept="video/*" required><br><br>
    <button type="submit">Upload & Extract Frames</button>
  </form>
</body>
</html>
