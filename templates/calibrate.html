<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calibrate Cameras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #1f6b3a;
    --court-light: #2e8b4f;
    --court-dim: #e5efe7;
    --line: #e8b13a;
    --ink: #1c2521;
    --muted: #5c6b62;
    --paper: #f7f8f4;
    --card: #ffffff;
    --border: #dfe4de;
    --danger: #c0392b;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0;
  }

  .page-shell {
    width: 100%;
    min-height: 100vh;
    padding: 28px 42px 36px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--court);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .steps {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .step-number {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  .step.done .step-number,
  .step.active .step-number {
    background: var(--court);
    color: #fff;
    border-color: var(--court);
  }

  .step.active {
    color: var(--ink);
    font-weight: 900;
  }

  .step-line {
    width: 22px;
    height: 1px;
    background: var(--border);
  }

  .page-layout {
    width: 100%;
    max-width: 1550px;
    height: calc(100vh - 92px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 245px;
    gap: 28px;
    align-items: stretch;
  }

  /* Right sidebar: reference on top, evaluation directly underneath. */
  .reference-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    order: 2;
    height: auto;
    align-self: start;
  }

  .reference-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }

  #guideSide {
    display: none;
  }

  #guideTop {
    display: block;
  }

  .reference-card.active {
    border-color: var(--line);
    box-shadow: 0 2px 10px rgba(232,177,58,.20);
  }

  .reference-card h4 {
    margin: 0 0 7px 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .reference-card img {
    width: 100%;
    object-fit: cover;
    display: block;
    border-radius: 6px;
  }

  .reference-note {
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--muted);
    margin: 0 2px;
  }

  .work-panel {
    min-width: 0;
    width: 100%;
    order: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .work-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  #status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: inline-block;
  }

  #status .role { color: var(--muted); }

  .btn-debug {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    flex: none;
    transition: border-color .12s, color .12s;
  }

  .btn-debug:hover {
    border-color: var(--court-light);
    color: var(--ink);
  }

  .debug-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    background: var(--court-dim);
    padding: 2px 6px;
    border-radius: 999px;
  }

  .controls {
    margin: 0 0 10px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }

  .btn:hover { background: #f0f2ef; }

  .btn-primary {
    background: var(--court);
    border-color: var(--court);
    color: #fff;
  }

  .btn-primary:hover { background: var(--court-light); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .hint {
    font-size: 12px;
    color: var(--muted);
  }

  .cam-tabs {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .cam-tab {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all .12s;
  }

  .cam-tab:hover {
    border-color: var(--court-light);
    color: var(--ink);
  }

  .cam-tab.selected {
    background: var(--court);
    border-color: var(--court);
    color: #fff;
  }

  .cam-tab .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c7cec9;
    flex: none;
  }

  .cam-tab.done .dot { background: var(--line); }
  .cam-tab.selected .dot { background: #fff; }

  .canvas-wrap {
    background: var(--card);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    border: 1px solid var(--border);
    width: 100%;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cam-stage {
    display: none;
    height: 100%;
    width: 100%;
  }

  .cam-stage.shown {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
    width: 100%;
    min-height: 0;
  }

  canvas {
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: crosshair;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    min-height: 0;
    min-width: 0;
    flex: 0 1 auto;
    display: block;
    background: #000;
    object-fit: contain;
  }

  canvas.inactive {
    opacity: 0.5;
    cursor: default;
  }

  .view-only-note {
    display: none;
    flex: none;
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    background: var(--court-dim);
    border-radius: 6px;
    padding: 6px 10px;
  }

  .cam-stage.viewonly .view-only-note { display: inline-block; }

  .evaluate-panel {
    margin-top: 150px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    width: 100%;
  }

  .evaluate-panel h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin: 0 0 4px 0;
  }

  .evaluate-panel .lead {
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
    margin: 0 0 12px 0;
  }

  .evaluate-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 9px;
  }


  #evaluateBtn {
    width: 100%;
  }

  #evalError {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  #progressView { display: none; margin-top: 4px; }

  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: var(--court-dim);
    overflow: hidden;
    margin: 14px 0 10px 0;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--court), var(--court-light));
    border-radius: 999px;
    transition: width .25s ease;
  }

  .progress-fill.indeterminate {
    width: 30% !important;
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }

  .progress-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #progressDone { display: none; margin-top: 14px; }
  #progressDone a.btn { text-decoration: none; display: inline-block; }

  @media (min-width: 901px) {
    body {
      overflow: hidden;
    }
  }

  @media (min-width: 1300px) {
    .page-shell { padding-left: 56px; padding-right: 56px; }
    .page-layout {
      grid-template-columns: minmax(0, 1fr) 245px;
      gap: 34px;
    }
    .reference-card { padding: 8px; }
  }

  @media (max-width: 900px) {
    .page-shell { padding: 24px 20px 36px; }

    .page-layout {
      height: auto;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .work-panel,
    .reference-panel {
      order: initial;
      height: auto;
    }

    .canvas-wrap {
      flex: none;
    }

    .reference-panel {
      display: grid;
      grid-template-columns: 1fr;
    }

    .reference-note {
      grid-column: auto;
    }

    .evaluate-panel {
      margin-top: 0;
    }

    .cam-tabs { margin-left: 0; }
  }

  @media (max-width: 560px) {
    .topbar {
      align-items: flex-start;
      flex-direction: column;
      margin-bottom: 22px;
    }

    .steps {
      width: 100%;
      justify-content: space-between;
    }

    .step-line { flex: 1; }

    .reference-panel {
      grid-template-columns: 1fr;
    }

    .reference-note {
      grid-column: auto;
    }

    .work-header {
      align-items: flex-start;
      flex-direction: column;
    }

    .controls {
      align-items: flex-start;
      flex-direction: column;
    }

    .cam-tabs {
      width: 100%;
    }

    .cam-tab {
      flex: 1;
      justify-content: center;
    }

    .evaluate-panel { padding: 16px; }
  }
</style>
</head>
<body>

<div class="page-shell">

  <div class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">SE</span>
      Camera Calibration
    </a>

    <div class="steps" aria-label="Evaluation progress">
      <span class="step done">
        <span class="step-number">1</span> Upload
      </span>
      <span class="step-line"></span>
      <span class="step active">
        <span class="step-number">2</span> Calibrate
      </span>
      <span class="step-line"></span>
      <span class="step">
        <span class="step-number">3</span> Dashboard
      </span>
    </div>
  </div>

  <div class="page-layout">

    <aside class="reference-panel">
      <div class="reference-card" id="guideTop">
        <h4>Top camera reference</h4>
        <img src="/static/guide/top_view.jpg" alt="Top camera reference">
      </div>

      <div class="evaluate-panel">
        <div id="evaluateForm">
          <h3>Run evaluation</h3>
          <div class="evaluate-row">
            <button class="btn btn-primary" id="evaluateBtn" disabled>Run Evaluation</button>
          </div>

          <div id="evalError"></div>
        </div>

        <div id="progressView">
          <h3>Processing serve&hellip;</h3>

          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="progress-stats">
            <span id="progressCount">frame 0</span>
            <span id="progressFps"></span>
          </div>

          <div id="progressDone">
            <p class="lead" style="margin-bottom:10px;">Evaluation complete.</p>
            <a class="btn btn-primary" id="resultsLink" href="/results">View dashboard</a>
          </div>
        </div>
      </div>
    </aside>

    <main class="work-panel">

      <div class="work-header">
        <div id="status">
          Drag any point to correct it.
          <span class="role"></span>
        </div>
        {% if sync_job_id %}
        <a class="btn-debug" id="syncCheckBtn" href="/sync-verify/{{ sync_job_id }}" target="_blank" rel="noopener" title="Debug tool — not required to calibrate">
          Check Synchronization
        </a>
        {% endif %}
      </div>

      <div class="controls">
        <script id="calib-config" type="application/json">{
          "num_points": {{ num_points }},
          "gcp_labels": {{ gcp_labels | tojson }},
          "side_guess": {{ side_guess | tojson }},
          "back_guess": {{ back_guess | tojson }},
          "side_confidence": {{ side_confidence | tojson }},
          "back_confidence": {{ back_confidence | tojson }},
          "side_source": {{ side_source | tojson }},
          "back_source": {{ back_source | tojson }}
        }</script>

        <button class="btn" id="resetBtn" type="button">Reset to Auto</button>
        <span class="hint">key: R = reset current camera to its auto guess</span>
        <div class="cam-tabs" id="camTabs">
          <button type="button" class="cam-tab" id="tabSide" data-cam="side">
            <span class="dot"></span> Side camera
          </button>
          <button type="button" class="cam-tab" id="tabBack" data-cam="back">
            <span class="dot"></span> Back camera
          </button>
        </div>
      </div>

      <div class="canvas-wrap">
        <div class="cam-stage" id="stageSide">
          <canvas id="sideCanvas" width="{{ side_w }}" height="{{ side_h }}"></canvas>
        </div>

        <div class="cam-stage" id="stageBack">
          <canvas id="backCanvas" width="{{ back_w }}" height="{{ back_h }}"></canvas>
        </div>
      </div>



    </main>
  </div>
</div>

<script>
const CALIB_CONFIG = JSON.parse(document.getElementById("calib-config").textContent);
const NUM_POINTS = CALIB_CONFIG.num_points;
const GCP_LABELS = CALIB_CONFIG.gcp_labels || [];

// Rectangle edges walk 3-4-6-5, NOT 3-4-5-6: GCP4->GCP5 is the box's diagonal.
const RECT_WALK = [3, 4, 6, 5];

const sideCanvas = document.getElementById("sideCanvas");
const backCanvas = document.getElementById("backCanvas");
const sideCtx = sideCanvas.getContext("2d");
const backCtx = backCanvas.getContext("2d");

const sideImg = new Image();
sideImg.src = "/static/uploads/side_frame.jpg";
sideImg.onload = () => redraw("side");

const backImg = new Image();
backImg.src = "/static/uploads/back_frame.jpg";
backImg.onload = () => redraw("back");

// Pre-populated from the server's auto guess. `edited` flips true once
// the user drags a point, after which it's trusted regardless of confidence.
let sidePoints = CALIB_CONFIG.side_guess.map(p => p.slice());
let backPoints = CALIB_CONFIG.back_guess.map(p => p.slice());
const sideOriginal = CALIB_CONFIG.side_guess.map(p => p.slice());
const backOriginal = CALIB_CONFIG.back_guess.map(p => p.slice());
let sideConfidence = CALIB_CONFIG.side_confidence.slice();
let backConfidence = CALIB_CONFIG.back_confidence.slice();
let sideEdited = CALIB_CONFIG.side_confidence.map(() => false);
let backEdited = CALIB_CONFIG.back_confidence.map(() => false);

let currentView = "side";
let userPinnedView = false;
let dragging = null; // { cam, index } while a marker is being dragged

const pointsFor     = cam => cam === "side" ? sidePoints : backPoints;
const confidenceFor = cam => cam === "side" ? sideConfidence : backConfidence;
const editedFor     = cam => cam === "side" ? sideEdited : backEdited;
const originalFor   = cam => cam === "side" ? sideOriginal : backOriginal;
const canvasFor     = cam => cam === "side" ? sideCanvas : backCanvas;
const ctxFor        = cam => cam === "side" ? sideCtx : backCtx;
const imgFor        = cam => cam === "side" ? sideImg : backImg;

function needsReview(cam, i) {
  return confidenceFor(cam)[i] === "low" && !editedFor(cam)[i];
}

function unresolvedCount(cam) {
  let n = 0;
  for (let i = 0; i < NUM_POINTS; i++) if (needsReview(cam, i)) n++;
  return n;
}

function redraw(cam) {
  const ctx = ctxFor(cam);
  const canvas = canvasFor(cam);
  const img = imgFor(cam);
  const points = pointsFor(cam);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  drawRect(ctx, points, cam);
  points.forEach((p, i) => drawPoint(ctx, cam, i));
}

// GCP3-4-6-5 overlay: should sit on the real right-side service-box
// floor rectangle. If it looks mirrored/rotated vs. the real court,
// near/far or center/right labels are swapped.
function drawRect(ctx, points, cam) {
  if (RECT_WALK.some(i => !points[i])) return;
  ctx.beginPath();
  RECT_WALK.forEach((i, k) => {
    const [x, y] = points[i];
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.strokeStyle = "rgba(0, 200, 255, 0.85)";
  // Keep the original side-view overlay size; use the larger version only for back view.
  ctx.lineWidth = cam === "back" ? 3 : 2;
  ctx.setLineDash(cam === "back" ? [8, 5] : [6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoint(ctx, cam, i) {
  const [x, y] = pointsFor(cam)[i];
  const review = needsReview(cam, i);
  const isDragging = dragging && dragging.cam === cam && dragging.index === i;

  ctx.fillStyle = review ? "#e8a23a" : "#2ecc71";
  ctx.beginPath();
  const markerRadius = cam === "back"
    ? (isDragging ? 13 : 10)
    : (isDragging ? 9 : 7);
  ctx.arc(x, y, markerRadius, 0, 2 * Math.PI);
  ctx.fill();

  ctx.lineWidth = cam === "back" ? 3 : 2;
  ctx.strokeStyle = "#fff";
  ctx.stroke();

  ctx.fillStyle = cam === "side"
  ? (review ? "#e8a23a" : "#000")
  : (review ? "#e8a23a" : "#dfe6e9");
  ctx.font = cam === "back"
    ? "bold 25px 'JetBrains Mono', monospace"
    : "bold 15px 'JetBrains Mono', monospace";
  const labelOffset = cam === "back" ? 14 : 11;
  ctx.fillText(`GCP${i}${review ? " ?" : ""}`, x + labelOffset, y - labelOffset);
}

function setView(cam, pinned) {
  currentView = cam;
  if (pinned) userPinnedView = true;

  document.getElementById("stageSide").classList.toggle("shown", cam === "side");
  document.getElementById("stageBack").classList.toggle("shown", cam === "back");
  sideCanvas.classList.toggle("inactive", cam !== "side");
  backCanvas.classList.toggle("inactive", cam !== "back");

  document.getElementById("tabSide").classList.toggle("selected", cam === "side");
  document.getElementById("tabBack").classList.toggle("selected", cam === "back");
  document.getElementById("tabSide").classList.toggle("done", unresolvedCount("side") === 0);
  document.getElementById("tabBack").classList.toggle("done", unresolvedCount("back") === 0);

  document.getElementById("guideTop").classList.add("active");

  redraw("side");
  redraw("back");
}

document.getElementById("tabSide").addEventListener("click", () => setView("side", true));
document.getElementById("tabBack").addEventListener("click", () => setView("back", true));

function updateStatus() {
  const status = document.getElementById("status");
  const evalBtn = document.getElementById("evaluateBtn");
  const sideLeft = unresolvedCount("side");
  const backLeft = unresolvedCount("back");

  setView(currentView, false);
  evalBtn.disabled = false; // all 7 markers always exist; just nudge to review

  if (sideLeft === 0 && backLeft === 0) {
    status.innerHTML = "All points look confirmed &mdash; check the cyan rectangle, then evaluate.";
    return;
  }

  const parts = [];
  if (sideLeft > 0) parts.push(`side camera: ${sideLeft} unconfirmed`);
  if (backLeft > 0) parts.push(`back camera: ${backLeft} unconfirmed`);
  status.innerHTML =
    `<span class="role">Orange points (marked "?") are auto-detected guesses &mdash; drag them into place. ` +
    parts.join(", ") + `.</span>`;
}

function canvasPos(cam, e) {
  const canvas = canvasFor(cam);
  const rect = canvas.getBoundingClientRect();
  return [
    (e.clientX - rect.left) * (canvas.width / rect.width),
    (e.clientY - rect.top) * (canvas.height / rect.height),
  ];
}

function nearestPointIndex(cam, x, y, maxDist) {
  let best = -1, bestDist = maxDist;
  pointsFor(cam).forEach((p, i) => {
    const d = Math.hypot(p[0] - x, p[1] - y);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

function attachDragHandlers(cam) {
  const canvas = canvasFor(cam);
  // Only make the larger hit area for the back-view markers.
  const HIT_RADIUS = cam === "back" ? 22 : 18;

  canvas.addEventListener("mousedown", (e) => {
    const [x, y] = canvasPos(cam, e);
    const idx = nearestPointIndex(cam, x, y, HIT_RADIUS);
    if (idx === -1) return;
    dragging = { cam, index: idx };
    redraw(cam);
  });

  canvas.addEventListener("mousemove", (e) => {
    if (!dragging || dragging.cam !== cam) return;
    const [x, y] = canvasPos(cam, e);
    pointsFor(cam)[dragging.index] = [
      Math.max(0, Math.min(canvas.width, x)),
      Math.max(0, Math.min(canvas.height, y)),
    ];
    redraw(cam);
  });

  window.addEventListener("mouseup", () => {
    if (!dragging || dragging.cam !== cam) return;
    editedFor(cam)[dragging.index] = true;
    dragging = null;
    redraw(cam);
    updateStatus();
  });
}

attachDragHandlers("side");
attachDragHandlers("back");

function resetCurrentCamera() {
  const cam = currentView;
  const points = pointsFor(cam);
  const original = originalFor(cam);
  for (let i = 0; i < NUM_POINTS; i++) {
    points[i] = original[i].slice();
    editedFor(cam)[i] = false;
  }
  redraw(cam);
  updateStatus();
}

document.getElementById("resetBtn").addEventListener("click", resetCurrentCamera);

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === "r" || e.key === "R") resetCurrentCamera();
});

/* ---------------- evaluate + live progress flow ---------------- */

let pollTimer = null;
let currentJobId = null;

function showError(msg) {
  const el = document.getElementById("evalError");
  el.textContent = msg;
  el.style.display = "block";
}

function clearError() {
  document.getElementById("evalError").style.display = "none";
}

function setProgressBar(current, total, fps, detected, message) {
  const fill = document.getElementById("progressFill");
  const count = document.getElementById("progressCount");
  const fpsEl = document.getElementById("progressFps");

  fill.classList.remove("indeterminate");

  if (total > 0) {
    const pct = Math.min(100, Math.max(0, (current / total) * 100));
    fill.style.width = pct + "%";
    count.textContent = `${current} / ${total} (${Math.round(pct)}%)`;
  } else {
    fill.style.width = "0%";
    fill.classList.add("indeterminate");
    count.textContent = message || "Starting…";
  }
}

async function pollProgress() {
  if (!currentJobId) return;

  try {
    const resp = await fetch(`/evaluation_status/${currentJobId}`, {
      cache: "no-store"
    });

    const data = await resp.json();

    if (!resp.ok || data.error) {
      clearInterval(pollTimer);
      pollTimer = null;

      showError(
        "Evaluation failed: " + (data.error || "Unknown error.")
      );

      document.getElementById("progressView").style.display = "none";
      document.getElementById("evaluateForm").style.display = "block";
      document.getElementById("evaluateBtn").disabled = false;
      document.getElementById("evaluateBtn").textContent = "Run Evaluation";
      return;
    }

    setProgressBar(
      data.current || 0,
      data.total || 0,
      data.fps,
      data.detected,
      data.message
    );

    if (data.status === "loading") {
      document.getElementById("progressCount").textContent = "Loading model…";
    }

    if (data.status === "evaluating") {
      document.getElementById("progressCount").textContent =
        "Finishing evaluation…";
    }

    if (data.done) {
      clearInterval(pollTimer);
      pollTimer = null;

      const fill = document.getElementById("progressFill");
      fill.classList.remove("indeterminate");
      fill.style.width = "100%";

      document.getElementById("progressCount").textContent =
        `${data.total} / ${data.total} (100%)`;

      document.getElementById("progressDone").style.display = "block";
      document.getElementById("resultsLink").href = data.result_url;
    }
  } catch (err) {
    clearInterval(pollTimer);
    pollTimer = null;
    showError("Lost connection while checking progress.");
  }
}

document.getElementById("evaluateBtn").addEventListener("click", async () => {
  clearError();

  const btn = document.getElementById("evaluateBtn");

  btn.disabled = true;
  btn.textContent = "Starting…";

  try {
    const saveResp = await fetch("/save_calibration", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        side_points: sidePoints,
        back_points: backPoints,
        side_w: sideCanvas.width,
        side_h: sideCanvas.height,
        back_w: backCanvas.width,
        back_h: backCanvas.height
      })
    });

    const saveData = await saveResp.json();

    if (!saveResp.ok || saveData.error) {
      throw new Error(
        "Could not save calibration: " +
        (saveData.error || "Unknown error.")
      );
    }

    const startResp = await fetch("/run_evaluation", {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: ""
    });

    const startData = await startResp.json();

    if (!startResp.ok || startData.error) {
      throw new Error(
        "Could not start evaluation: " +
        (startData.error || "Unknown error.")
      );
    }

    currentJobId = startData.job_id;

    document.getElementById("evaluateForm").style.display = "none";
    document.getElementById("progressView").style.display = "block";
    document.getElementById("progressDone").style.display = "none";

    setProgressBar(0, 0, null, 0, "Starting…");

    pollTimer = setInterval(pollProgress, 250);
    pollProgress();

  } catch (err) {
    showError(
      err.message || "Something went wrong starting the evaluation."
    );

    btn.disabled = false;
    btn.textContent = "Run Evaluation";
  }
});

updateStatus();
</script>
